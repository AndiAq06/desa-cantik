services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        BAKE_VENDOR: "0"
    container_name: desa_cantik_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - desa-cantik-network
    depends_on:
      - mysql
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: desa_cantik_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - desa-cantik-network
    depends_on:
      - app
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: desa_cantik_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: desa_cantik_db
      MYSQL_USER: desa_cantik_user
      MYSQL_PASSWORD: DesaCantik2025!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - desa-cantik-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: desa_cantik_pma
    restart: always
    environment:
      PMA_HOST: mysql                 # Harus sama dengan nama service database
      PMA_PORT: 3306
      PMA_USER: desa_cantik_user
      PMA_PASSWORD: DesaCantik2025!
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"                     # Kita buka di port 8081
    depends_on:
      - mysql
    networks:
      - desa-cantik-network

networks:
  desa-cantik-network:
    driver: bridge
volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local
